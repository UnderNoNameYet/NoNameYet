name: Finalize TenantProof v0.3.2 matrix release

on:
  push:
    branches:
      - feature/tenant-boundary-matrix-20260901

permissions:
  contents: write

concurrency:
  group: tenantproof-matrix-v032-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/tenant-boundary-matrix-20260901
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic quality dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==10.4.0 reportlab==5.0.0
          npm install --no-save --package-lock=false playwright@1.52.0
          npx playwright install --with-deps chromium
          CHROMIUM_PATH="$(node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")"
          test -x "$CHROMIUM_PATH"
          sudo ln -sf "$CHROMIUM_PATH" /usr/local/bin/chromium
          chromium --version

      - name: Run validated v0.3.2 finalizer
        shell: bash
        run: bash tools/.matrix-finalize-v032.sh
