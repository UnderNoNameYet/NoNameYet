name: Reconcile TenantProof publication handoff

on:
  push:
    branches: [docs/tenantproof-publication-state-20260831]
    paths:
      - .github/workflows/reconcile-handoff.yml
      - .github/reconcile/tenantproof-postdeploy.patch.gz.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic document dependencies
        run: python -m pip install --disable-pip-version-check reportlab==5.0.0 pillow==10.4.0

      - name: Apply reviewed documentation patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/reconcile/tenantproof-postdeploy.patch.gz.b64 > /tmp/tenantproof-postdeploy.patch.gz
          echo 'bab50c80122623826ebbf6b9623d8f3274c9e6f75baea0e882134f0e07cfdacf  /tmp/tenantproof-postdeploy.patch.gz' | sha256sum -c -
          gzip -dc /tmp/tenantproof-postdeploy.patch.gz > /tmp/tenantproof-postdeploy.patch
          patch -p1 --dry-run < /tmp/tenantproof-postdeploy.patch
          patch -p1 < /tmp/tenantproof-postdeploy.patch
          rm -f .github/workflows/reconcile-handoff.yml .github/reconcile/tenantproof-postdeploy.patch.gz.b64
          rmdir .github/reconcile 2>/dev/null || true

      - name: Regenerate handoff artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm run handoff:report
          for pass in 1 2 3; do
            npm run handoff:manifest > /tmp/manifest-$pass.log
            python - <<'PY'
          import json
          from pathlib import Path
          state_path = Path('handoff/CURRENT_STATE.json')
          manifest_path = Path('handoff/SOURCE_MANIFEST.json')
          state = json.loads(state_path.read_text())
          manifest = json.loads(manifest_path.read_text())
          quality = state['quality']
          quality['sourceManifestFiles'] = manifest['files']
          quality['sourceManifestBytes'] = manifest['bytes']
          state_path.write_text(json.dumps(state, indent=2) + '\n')
          PY
          done
          npm run handoff:manifest
          python - <<'PY'
          import json
          state = json.load(open('handoff/CURRENT_STATE.json'))
          manifest = json.load(open('handoff/SOURCE_MANIFEST.json'))
          assert state['quality']['sourceManifestFiles'] == manifest['files']
          assert state['quality']['sourceManifestBytes'] == manifest['bytes']
          assert manifest['version'] == '0.3.1'
          print({'files': manifest['files'], 'bytes': manifest['bytes'], 'version': manifest['version']})
          PY
          node --check tools/check-docs.mjs
          node --check tools/build-source-manifest.mjs
          npm run docs:check
          npm run release:check

      - name: Commit reconciled state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            AGENTS.md README.md CHANGELOG.md package.json \
            handoff/CURRENT_STATE.json handoff/GITHUB_PUBLICATION.md \
            handoff/HANDOFF_REPORT.md handoff/HANDOFF_REPORT.pdf \
            handoff/SOURCE_MANIFEST.json handoff/AI_CONTINUATION.md \
            handoff/DECISION_LOG.md handoff/RELEASE_AND_REPOSITORY.md \
            operations/github-release-runbook.md operations/launch-checklist.md \
            operations/operator-decisions.md tools/build-handoff-report.py \
            tools/check-docs.mjs tools/build-source-manifest.mjs
          git diff --cached --stat
          git commit -m 'docs: reconcile deployed TenantProof state'
          git push origin HEAD:${{ github.ref_name }}
