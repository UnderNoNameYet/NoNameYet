name: Diagnose TenantProof sample matrix materializer

on:
  push:
    branches:
      - feature/tenant-boundary-matrix-20260901

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/tenant-boundary-matrix-20260901
          fetch-depth: 0

      - name: Persist exact extraction or patch result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import traceback

          log = []
          try:
              workflow = Path('.github/workflows/materialize-sample-matrix.yml')
              source = workflow.read_text(encoding='utf-8')
              log.append(f'workflow_bytes={len(source.encode())}')
              log.append(f'payload_open_markers={source.count("PAYLOAD") }')
              payload = source.split("<<'PAYLOAD'\n", 1)[1].split('\n          PAYLOAD', 1)[0]
              compact = ''.join(payload.split())
              log.append(f'payload_chars={len(compact)}')
              compressed = base64.b64decode(compact, validate=True)
              decoded = gzip.decompress(compressed)
              digest = hashlib.sha256(decoded).hexdigest()
              log.append(f'patch_bytes={len(decoded)}')
              log.append(f'patch_sha256={digest}')
              expected = '40f3effc57a5d98e0cf85889b635420381cb2f94a547c80fc701e233fdf1c475'
              if digest != expected:
                  raise RuntimeError(f'Patch checksum mismatch: {digest}')
              target = Path('tools/apply-sample-matrix.py')
              target.write_bytes(decoded)
              import subprocess
              result = subprocess.run(['python', str(target)], text=True, capture_output=True)
              log.append(f'patch_exit={result.returncode}')
              log.append('patch_stdout:\n' + result.stdout)
              log.append('patch_stderr:\n' + result.stderr)
          except Exception:
              log.append('exception:\n' + traceback.format_exc())
          Path('MATERIALIZER_ERROR.txt').write_text('\n'.join(log) + '\n', encoding='utf-8')
          PY
          rm -f tools/apply-sample-matrix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MATERIALIZER_ERROR.txt
          git commit -m 'chore: record matrix materializer diagnostic'
          git push origin HEAD:feature/tenant-boundary-matrix-20260901
