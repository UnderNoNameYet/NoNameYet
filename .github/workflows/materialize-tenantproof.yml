name: Materialize TenantProof source

on:
  push:
    branches:
      - launch/tenantproof-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tenantproof-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and verify staged source
        env:
          PAGE_ID_B64: MjM3YTk1NTBhMDkwNGViOTk0MjdjODM2NGI0MjMzYzYK
          SOURCE_FILENAME: TenantProof-v0.3.0-source-staging.pdf
          SOURCE_SHA256: 1e238a2909e5d433c2c41057906da0edf6aefd602bd2b5ae7aafde713a3b3264
        shell: bash
        run: |
          set -o pipefail
          archive="$RUNNER_TEMP/tenantproof-source-staging.pdf"
          ARCHIVE="$archive" python3 - <<'PYDOWNLOAD' 2>&1 | tee "$RUNNER_TEMP/materialize.log"
          import base64
          import hashlib
          import json
          import os
          import time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen

          compact_page_id = base64.b64decode(os.environ["PAGE_ID_B64"]).decode().strip().replace("-", "")
          if len(compact_page_id) != 32:
              raise SystemExit("staged page ID is invalid")
          uuid_page_id = (
              compact_page_id[:8] + "-" + compact_page_id[8:12] + "-" +
              compact_page_id[12:16] + "-" + compact_page_id[16:20] + "-" +
              compact_page_id[20:]
          )
          expected_name = os.environ["SOURCE_FILENAME"]
          expected_sha = os.environ["SOURCE_SHA256"]
          archive = Path(os.environ["ARCHIVE"])
          bases = (
              "https://www.notion.so/api/v3",
              "https://www.notion.com/api/v3",
          )

          def post_json(base, endpoint, payload):
              request = Request(
                  f"{base}/{endpoint}",
                  data=json.dumps(payload).encode(),
                  headers={
                      "accept": "application/json",
                      "content-type": "application/json",
                      "user-agent": "TenantProof source materializer/1.3",
                  },
                  method="POST",
              )
              with urlopen(request, timeout=45) as response:
                  return json.load(response)

          chunk = None
          api_base = None
          errors = []
          payloads = []
          for page_id in (uuid_page_id, compact_page_id):
              payloads.extend((
                  {
                      "pageId": page_id,
                      "limit": 100,
                      "chunkNumber": 0,
                      "cursor": {"stack": []},
                      "verticalColumns": False,
                  },
                  {
                      "page": {"id": page_id},
                      "limit": 100,
                      "chunkNumber": 0,
                      "cursor": {"stack": []},
                      "verticalColumns": False,
                  },
              ))
          for base in bases:
              for endpoint in ("loadPageChunk", "loadCachedPageChunk"):
                  for payload in payloads:
                      try:
                          candidate = post_json(base, endpoint, payload)
                          blocks = candidate.get("recordMap", {}).get("block")
                          if blocks:
                              chunk, api_base = candidate, base
                              print(f"Resolved public page through {base}/{endpoint}")
                              break
                          errors.append(f"{base}/{endpoint}: empty record map")
                      except HTTPError as error:
                          errors.append(f"{base}/{endpoint}: HTTP {error.code}")
                      except Exception as error:
                          errors.append(f"{base}/{endpoint}: {type(error).__name__}")
                  if chunk:
                      break
              if chunk:
                  break
          if not chunk or not api_base:
              raise SystemExit("public source page could not be resolved: " + "; ".join(errors))

          source = None
          block_id = None
          for entry in chunk["recordMap"]["block"].values():
              value = entry.get("value") if isinstance(entry, dict) else None
              if isinstance(value, dict) and isinstance(value.get("value"), dict):
                  value = value["value"]
              if not isinstance(value, dict) or value.get("type") not in {"file", "pdf"}:
                  continue
              candidate = (((value.get("properties") or {}).get("source") or [[None]])[0] or [None])[0]
              if isinstance(candidate, str) and expected_name in candidate:
                  source = candidate
                  block_id = value.get("id")
                  break
          if not source or not block_id:
              raise SystemExit("verified source attachment was not found in the public record map")

          parsed_source = urlparse(source)
          if parsed_source.scheme == "https":
              signed_url = source
          else:
              signed = post_json(
                  api_base,
                  "getSignedFileUrls",
                  {
                      "urls": [
                          {
                              "permissionRecord": {"table": "block", "id": block_id},
                              "url": source,
                          }
                      ]
                  },
              )
              signed_url = (signed.get("signedUrls") or [None])[0]
          if not isinstance(signed_url, str):
              raise SystemExit("Notion did not issue a source download URL")

          parsed = urlparse(signed_url)
          allowed_host = (
              parsed.hostname == "file.notion.so"
              or parsed.hostname == "file.notion.com"
              or (parsed.hostname or "").endswith(".amazonaws.com")
          )
          if parsed.scheme != "https" or not allowed_host:
              raise SystemExit("source download host was not allowlisted")

          for attempt in range(3):
              try:
                  request = Request(signed_url, headers={"user-agent": "TenantProof source materializer/1.3"})
                  with urlopen(request, timeout=90) as response:
                      archive.write_bytes(response.read())
                  break
              except Exception:
                  if attempt == 2:
                      raise
                  time.sleep(2 ** attempt)

          actual_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f"source SHA-256 mismatch: {actual_sha}")
          print(f"Verified source container: {actual_sha}")
          PYDOWNLOAD
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          set -euo pipefail

          cp -a .github/workflows "$RUNNER_TEMP/original-workflows"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          ARCHIVE="$archive" python3 - <<'PYEXTRACT'
          import os
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          destination = Path.cwd().resolve()
          with ZipFile(os.environ["ARCHIVE"]) as bundle:
              for info in bundle.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive entry: {info.filename}")
              bundle.extractall(destination)
          PYEXTRACT

          rm -rf .github/workflows
          mkdir -p .github
          cp -a "$RUNNER_TEMP/original-workflows" .github/workflows

          test -f AGENTS.md
          test -f agent.md
          test -f public/index.html
          test -f .github/pull_request_template.md
          test -f .github/workflows/pages.yml
          test -f .github/workflows/materialize-tenantproof.yml
          test -f handoff/HANDOFF_REPORT.md
          test ! -e public-source
          test ! -e deploy
          test ! -e homepage-v3
          test ! -e immersive-overrides
          test ! -e public-overrides

      - name: Commit sanitized diagnostic
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if [ -s "$RUNNER_TEMP/materialize.log" ]; then
            cp "$RUNNER_TEMP/materialize.log" release/materialize-error.txt
          else
            printf '%s\n' 'Materialization failed without a captured resolver diagnostic.' > release/materialize-error.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/materialize-error.txt
          git commit -m "chore: record source materialization diagnostic" || exit 0
          git push origin HEAD:launch/tenantproof-v1

      - name: Commit direct TenantProof source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialization changes found."
            exit 0
          fi
          git commit -m "feat: materialize TenantProof v0.3.0 source"
          git push origin HEAD:launch/tenantproof-v1
