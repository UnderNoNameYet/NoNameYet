name: Materialize TenantProof sample matrix v4

on:
  push:
    branches:
      - feature/tenant-boundary-matrix-20260901

permissions:
  contents: write

concurrency:
  group: tenantproof-sample-matrix-materializer-v4
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/tenant-boundary-matrix-20260901
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic quality dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==10.4.0 reportlab==5.0.0
          npm install --no-save --package-lock=false playwright@1.52.0
          npx playwright install --with-deps chromium
          CHROMIUM_PATH="$(node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")"
          test -x "$CHROMIUM_PATH"
          sudo ln -sf "$CHROMIUM_PATH" /usr/local/bin/chromium
          chromium --version

      - name: Materialize, validate, and commit release
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/tenantproof-matrix-v4.log) 2>&1
          on_error() {
            status=$?
            trap - ERR
            set +e
            {
              echo "materializer_exit=$status"
              echo "--- last log bytes ---"
              tail -c 20000 /tmp/tenantproof-matrix-v4.log
            } > MATERIALIZER_ERROR.txt
            rm -f tools/apply-sample-matrix.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add MATERIALIZER_ERROR.txt
            git commit -m 'chore: record matrix v4 materializer failure'
            git push origin HEAD:feature/tenant-boundary-matrix-20260901
            exit "$status"
          }
          trap on_error ERR

          cat tools/.matrix-chunk-* | base64 -d | gzip -d > tools/apply-sample-matrix.py
          echo '5aed4b833abef6b2698f1eaa726c1a78f0fd1ec018b47c24c49f57666afd390b  tools/apply-sample-matrix.py' | sha256sum -c -
          python tools/apply-sample-matrix.py

          python - <<'PY'
          from pathlib import Path

          def replace_once(relative_path, old, new):
              path = Path(relative_path)
              source = path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{relative_path}: expected one post-patch match, found {count}')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'public/sample-matrix.html',
              '''          <tr><td><code>projects</code></td><td>member · Tenant A</td><td>Tenant B</td><td>UPDATE</td><td>Deny reassignment</td></tr>
          <tr><td><code>customer_notes</code></td><td>manager · Tenant A</td><td>Tenant A</td><td>INSERT</td><td>Allow valid note</td></tr>''',
              '''          <tr><td><code>projects</code></td><td>member · Tenant A</td><td>Tenant B</td><td>UPDATE</td><td>Deny reassignment</td></tr>
          <tr><td><code>customer_notes</code></td><td>manager · Tenant A</td><td>Tenant A</td><td>DELETE</td><td>Allow own-tenant delete</td></tr>
          <tr><td><code>customer_notes</code></td><td>manager · Tenant A</td><td>Tenant B</td><td>DELETE</td><td>Deny foreign delete</td></tr>
          <tr><td><code>customer_notes</code></td><td>manager · Tenant A</td><td>Tenant A</td><td>INSERT</td><td>Allow valid note</td></tr>'''
          )
          replace_once(
              'public/sample-matrix.html',
              '''    <div class="button-row"><a class="button" href="assets/sample-boundary-matrix.csv" download>Download the fictional matrix</a><a class="button button-secondary" href="request.html">Build a private scope brief</a></div>''',
              '''    <div class="button-row"><a class="button button-secondary" href="report.html">See the evidence format</a><a class="button button-secondary" href="request.html">Build a private scope brief</a></div>'''
          )
          replace_once(
              'public/assets/sample-boundary-matrix.csv',
              '''TP-MATRIX-003,table,projects,member,Tenant A,Tenant B,UPDATE,Deny tenant reassignment,negative,untested,Fictional starter; confirm row remains unchanged
TP-MATRIX-004,table,customer_notes,manager,Tenant A,Tenant A,INSERT,Allow valid own-tenant note,positive,untested,Fictional starter; use synthetic data
TP-MATRIX-005,table,customer_notes,manager,Tenant A,Tenant B,INSERT,Deny foreign tenant assignment,negative,untested,Fictional starter; test proposed-row checks
TP-MATRIX-006,function,archive_project(),manager,Tenant A,Tenant B,RPC,Deny foreign mutation,negative,untested,Fictional starter; confirm no side effect
TP-MATRIX-007,storage,customer-files,member,Tenant A,Tenant A,DOWNLOAD,Allow own-tenant file,positive,untested,Fictional starter; use synthetic file
TP-MATRIX-008,storage,customer-files,member,Tenant A,Tenant B,LIST,Deny foreign metadata,negative,untested,Fictional starter; do not include secrets''',
              '''TP-MATRIX-003,table,projects,member,Tenant A,Tenant B,UPDATE,Deny tenant reassignment,negative,untested,Fictional starter; confirm row remains unchanged
TP-MATRIX-004,table,customer_notes,manager,Tenant A,Tenant A,DELETE,Allow own-tenant delete,positive,untested,Fictional starter; use synthetic data and confirm intended cascades
TP-MATRIX-005,table,customer_notes,manager,Tenant A,Tenant B,DELETE,Deny foreign delete,negative,untested,Fictional starter; confirm row and related records remain unchanged
TP-MATRIX-006,table,customer_notes,manager,Tenant A,Tenant A,INSERT,Allow valid own-tenant note,positive,untested,Fictional starter; use synthetic data
TP-MATRIX-007,table,customer_notes,manager,Tenant A,Tenant B,INSERT,Deny foreign tenant assignment,negative,untested,Fictional starter; test proposed-row checks
TP-MATRIX-008,function,archive_project(),manager,Tenant A,Tenant B,RPC,Deny foreign mutation,negative,untested,Fictional starter; confirm no side effect
TP-MATRIX-009,storage,customer-files,member,Tenant A,Tenant A,DOWNLOAD,Allow own-tenant file,positive,untested,Fictional starter; use synthetic file
TP-MATRIX-010,storage,customer-files,member,Tenant A,Tenant B,LIST,Deny foreign metadata,negative,untested,Fictional starter; do not include secrets'''
          )
          replace_once(
              'tools/capture-previews.mjs',
              '''  await mobilePage.goto(`${base}/request.html?package=repair`, { waitUntil: 'networkidle' });
  await mobilePage.screenshot({ path: path.join(out, 'tenantproof-request-mobile.png'), fullPage: true });
  await mobile.close();''',
              '''  await mobilePage.goto(`${base}/request.html?package=repair`, { waitUntil: 'networkidle' });
  await mobilePage.screenshot({ path: path.join(out, 'tenantproof-request-mobile.png'), fullPage: true });
  await mobilePage.goto(`${base}/index.html`, { waitUntil: 'networkidle' });
  await mobilePage.screenshot({ path: path.join(out, 'tenantproof-mobile.png'), fullPage: true });
  await mobile.close();'''
          )
          replace_once(
              'tools/capture-previews.mjs',
              "['tenantproof-hero-desktop.png', 'tenantproof-report-desktop.png', 'tenantproof-matrix-desktop.png', 'tenantproof-request-mobile.png']",
              "['tenantproof-hero-desktop.png', 'tenantproof-report-desktop.png', 'tenantproof-matrix-desktop.png', 'tenantproof-request-mobile.png', 'tenantproof-mobile.png']"
          )
          PY

          rm .github/workflows/materialize-sample-matrix-v4.yml
          rm tools/.matrix-chunk-* tools/apply-sample-matrix.py
          rm -f MATERIALIZER_ERROR.txt

          mkdir -p build
          cp handoff/assets/walkthrough.webm build/walkthrough.webm
          node tools/capture-previews.mjs
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          image = Image.open('build/tenantproof-matrix-desktop.png')
          dimensions = f'{image.width}×{image.height}'
          path = Path('handoff/ASSET_MANIFEST.md')
          source = path.read_text(encoding='utf-8')
          if source.count('generated full page') != 1:
              raise SystemExit('Expected one matrix dimension placeholder')
          path.write_text(source.replace('generated full page', dimensions, 1), encoding='utf-8')
          print({'matrixCapture': dimensions})
          PY
          node tools/sync-handoff-assets.mjs
          npm run handoff:report

          for pass_number in 1 2 3 4; do
            npm run handoff:manifest >/tmp/tenantproof-manifest.log
            python - <<'PY'
          from pathlib import Path
          import json
          state_path = Path('handoff/CURRENT_STATE.json')
          manifest_path = Path('handoff/SOURCE_MANIFEST.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          state['quality']['latestKnownResult'] = 'pass'
          state['quality']['sourceManifestFiles'] = manifest['files']
          state['quality']['sourceManifestBytes'] = manifest['bytes']
          state['quality']['mustRerunAfterChanges'] = False
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')
          PY
          done
          npm run handoff:manifest
          npm run quality

          python - <<'PY'
          from pathlib import Path
          import json
          state_path = Path('handoff/CURRENT_STATE.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          quality = json.loads(Path('build/quality-gate.json').read_text(encoding='utf-8'))
          qa = json.loads(Path('build/qa-results.json').read_text(encoding='utf-8'))
          docs = json.loads(Path('build/docs-check.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('handoff/SOURCE_MANIFEST.json').read_text(encoding='utf-8'))
          q = state['quality']
          q['latestKnownResult'] = 'pass'
          q['latestRunAt'] = quality['generatedAt']
          q['qualityGateSteps'] = len(quality['steps'])
          q['documentationChecks'] = docs['checks']
          q['requiredFiles'] = qa['static']['requiredFiles']
          q['htmlPages'] = qa['static']['htmlPages']
          q['consoleErrors'] = qa['browser']['consoleErrors']
          q['externalRuntimeRequests'] = qa['browser']['externalRequests']
          q['mobileOverflowPages'] = qa['browser']['mobileOverflowPages']
          q['sourceManifestFiles'] = manifest['files']
          q['sourceManifestBytes'] = manifest['bytes']
          q['mustRerunAfterChanges'] = False
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')
          PY
          npm run handoff:report

          for pass_number in 1 2 3 4; do
            npm run handoff:manifest >/tmp/tenantproof-manifest.log
            python - <<'PY'
          from pathlib import Path
          import json
          state_path = Path('handoff/CURRENT_STATE.json')
          manifest_path = Path('handoff/SOURCE_MANIFEST.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          state['quality']['sourceManifestFiles'] = manifest['files']
          state['quality']['sourceManifestBytes'] = manifest['bytes']
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')
          PY
          done
          npm run handoff:manifest
          npm run docs:check
          npm run release:bundle
          npm run release:check

          test "$(find dist -type f | wc -l)" -eq 24
          test "$(find public -type f | wc -l)" -eq 24
          test "$(grep -c ',DELETE,' public/assets/sample-boundary-matrix.csv)" -eq 2
          test "$(grep -c 'href=\"assets/sample-boundary-matrix.csv\"' public/sample-matrix.html)" -eq 1
          grep -q 'sample-boundary-matrix.csv' public/sample-matrix.html
          grep -q 'sample-matrix.html' public/index.html
          grep -q 'sample-matrix.html' public/sitemap.xml
          test -f handoff/assets/08-sample-matrix-desktop.png
          test ! -e .github/workflows/materialize-sample-matrix-v4.yml
          test -z "$(find tools -maxdepth 1 -name '.matrix-chunk-*' -print -quit)"
          test ! -e tools/apply-sample-matrix.py
          test ! -e MATERIALIZER_ERROR.txt
          git diff --check

          rm -rf node_modules
          trap - ERR
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'feat: add free tenant-boundary matrix'
          git push origin HEAD:feature/tenant-boundary-matrix-20260901
