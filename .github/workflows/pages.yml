name: Deploy RebuttalKit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct product archive
        shell: bash
        run: |
          cat product/site.part-* > /tmp/rebuttalkit-site.tar.gz.b64
          base64 --decode /tmp/rebuttalkit-site.tar.gz.b64 > /tmp/rebuttalkit-site.tar.gz
          echo "8fa22131eb70cb2ce3ffca58096e1e369635afbcbf898044e060d6a9273fd131  /tmp/rebuttalkit-site.tar.gz" | sha256sum --check -
          mkdir -p public
          tar -xzf /tmp/rebuttalkit-site.tar.gz -C public

      - name: Validate static build
        shell: bash
        run: |
          test -f public/index.html
          test -f public/styles.css
          test -f public/app.js
          test -f public/sw.js
          test -f public/manifest.webmanifest
          test -f public/.nojekyll
          node --check public/app.js
          if grep -REn --exclude='*.map' '(sk_live_|pk_live_|AKIA[0-9A-Z]{16}|BEGIN (RSA |OPENSSH )?PRIVATE KEY)' public; then
            echo "Possible production secret found in deployable source" >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
