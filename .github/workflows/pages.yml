name: Deploy SettleSift to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild verified product site
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public

          python3 scripts/decode-bundle.py \
            --output site.tar.gz \
            --sha c3fcfe72df6f6449a2d7d706bb24c6bbcc3c7009fcc4101e4100c3bcd07d8bfa \
            deploy/site.part-*
          tar -xzf site.tar.gz -C public

          python3 scripts/decode-bundle.py \
            --output overrides.tar.gz \
            --sha d82cc19114dbe8a776290dc27488e46e080a24df2d3df1acd15eb3d839ec7572 \
            --repair-one-missing-in-first \
            public-overrides/site.part-*
          tar -xzf overrides.tar.gz -C public

          printf 'Installing tested professional homepage...\n'
          python3 scripts/decode-bundle.py \
            --output homepage-v3.html.gz \
            --sha 6173422ea287e8c8daf99037c17b9a1a7cf1869fa83f80fe0edc66f867a86155 \
            homepage-v3/site.part-*
          gzip -dc homepage-v3.html.gz > public/index.html
          echo "a8da784b8f73fc7e6d7522212f1e4753ddfc88c3bd93f1a3ef3e1b9fb684c076  public/index.html" | sha256sum --check --strict

          cp site-config.js public/site-config.js
          test -f public/index.html
          test -f public/app.html
          test -f public/download.html
          test -f public/tutorial.html
          test -f public/privacy.html
          test -f public/terms.html
          echo "1ab779e9af850e2ecbc43d2944a0aba38fd3fc73a459c2c8f73cc10331bd0fe0  public/app.html" | sha256sum --check --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
