name: Deploy RebuttalKit to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate and build v7
        run: node test.mjs
      - name: Verify complete website release
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'The dispute arrives' public/index.html
          grep -q 'A calmer way' public/about.html
          grep -q 'Six deliberate passes' public/tutorial.html
          grep -q 'RebuttalKit Product Website v7' public/release-v7.txt
          test -f public/download.html
          test -f public/app.html
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
