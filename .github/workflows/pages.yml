name: Deploy RebuttalKit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build direct static site
        run: bash scripts/build-site.sh

      - name: Validate deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          node --check public/site.js
          node --check public/app.js
          node --check public/app-shell.js
          node --check public/sw.js
          python3 -m json.tool public/manifest.webmanifest >/dev/null
          test -f public/premium.css
          test -f public/app.html
          grep -q 'Build the record' public/index.html
          grep -q 'premium.css' public/index.html
          grep -q 'premium.css' public/app.html
          ! grep -RIE 'sk_live_|pk_live_|checkout\.stripe\.com|buy\.stripe\.com' public

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
