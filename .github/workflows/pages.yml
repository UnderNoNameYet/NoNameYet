name: Deploy SettleSift to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild tested static site
        run: |
          set -euo pipefail
          mkdir -p public
          cat deploy/site.part-* | base64 --decode > site.tar.gz
          tar -xzf site.tar.gz -C public
          cat public-overrides/site.part-* | base64 --decode > overrides.tar.gz
          echo "d82cc19114dbe8a776290dc27488e46e080a24df2d3df1acd15eb3d839ec7572  overrides.tar.gz" | sha256sum --check --strict
          tar -xzf overrides.tar.gz -C public
          cat immersive-overrides/site.b64 | base64 --decode > immersive-overrides.tar.gz
          echo "ae6dc5eaf1a6c6e290c51aa92bc62fa8c561d0a248acdda0260dfe45b935c80d  immersive-overrides.tar.gz" | sha256sum --check --strict
          tar -xzf immersive-overrides.tar.gz -C public
          cp site-config.js public/site-config.js
          test -f public/index.html
          test -f public/app.html
          test -f public/download.html
          test -f public/tutorial.html
          echo "1ab779e9af850e2ecbc43d2944a0aba38fd3fc73a459c2c8f73cc10331bd0fe0  public/app.html" | sha256sum --check --strict
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
