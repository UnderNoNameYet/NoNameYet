name: Finalize TenantProof v0.3.2 publication record

on:
  push:
    branches:
      - docs/tenantproof-v032-post-deploy
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tenantproof-v032-publication-finalizer
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: docs/tenantproof-v032-post-deploy
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic release dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==10.4.0 reportlab==4.2.5
          npm install --no-save --no-package-lock playwright@1.50.1
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          CHROMIUM_PATH="$(node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")"
          sudo ln -sf "$CHROMIUM_PATH" /usr/local/bin/chromium

      - name: Reconcile verified publication facts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one occurrence, found {count}: {old[:90]!r}')
              write(path, text.replace(old, new, 1))

          def replace_section(path, start_heading, next_heading, replacement):
              text = read(path)
              start = text.find(start_heading)
              end = text.find(next_heading, start + len(start_heading))
              if start < 0 or end < 0:
                  raise RuntimeError(f'{path}: section boundaries not found: {start_heading!r} -> {next_heading!r}')
              write(path, text[:start] + replacement.rstrip() + '\n\n' + text[end:])

          replace_section(
              'AGENTS.md',
              '## Current state — 2026-08-31',
              '## Offer and pricing',
              '''## Current state — 2026-09-04

          - Product specification, static MVP, production-preparation assets, and operating safeguards: complete.
          - Product UI: v0.3.2 is live with the concise product-first homepage, free boundary matrix, and sidebar-free Focus Workbench organized as Scope → Matrix → Run → Repair → Report.
          - GitHub release: PR [#25](https://github.com/UnderNoNameYet/NoNameYet/pull/25) was squash-merged to `main` at `8ae0bea48491b1442b1181e2c1bed21b1f2479e1` on 2026-09-03.
          - Deployment: main workflow run #49 completed successfully. The exact commit check reports a successful build, and public verification on 2026-09-04 returned the v0.3.2 homepage, workbench, matrix, methodology, request, privacy, terms, 404, report JSON, and matrix CSV.
          - Deployment boundary: exactly 26 files generated from `public/`; repository handoff, operations, tests, and build output remain unpublished.
          - Runtime state: request-only preview, `state: preview`, `paymentMode: closed`, local worksheet/report import, and no hosted account, analytics, scanner, or credential collection.
          - Payment, commercial intake, customer work, testimonials, revenue, and real findings: none; never imply otherwise.
          - Immediate prior known-good main is `f17ff3476735f423445cb37cb6084b3763c42269`; the older pre-TenantProof rollback reference is `047691e35c6b8d38ba5540d1fe4de345ed752a6c`.

          The canonical machine source is the current repository root on `main`; local `/data/` paths are release-session mirrors only. Historical paths for RebuttalKit, Stay5, screenshot concepts, or ClearCal are not active products.'''
          )

          replace_once(
              'CHANGELOG.md',
              '- prepared in draft PR [#25](https://github.com/UnderNoNameYet/NoNameYet/pull/25)\n- v0.3.1 remains the live GitHub Pages release until this candidate passes review and is merged',
              '- released through squash-merged PR [#25](https://github.com/UnderNoNameYet/NoNameYet/pull/25) at `8ae0bea48491b1442b1181e2c1bed21b1f2479e1`\n- deployed by successful main Pages workflow run #49 with an exact 26-file public-only artifact\n- live v0.3.2 routes and fictional JSON/CSV artifacts verified on 2026-09-04 at `https://undernonameyet.github.io/NoNameYet/`'
          )

          state_path = ROOT / 'handoff/CURRENT_STATE.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['snapshotAt'] = '2026-09-04T10:15:58+05:30'
          state['stage'] = 'v0.3.2 Focus Workbench request-only technical preview live; commercial intake and payment closed'
          state['sourcePath'] = 'repository root on current main'
          repo = state['repository']
          repo.update({
              'access': 'connected_published_and_verified',
              'tenantProofDeployed': True,
              'inspectedMainSha': '8ae0bea48491b1442b1181e2c1bed21b1f2479e1',
              'liveVersion': '0.3.2',
              'pagesWorkflow': '.github/workflows/pages.yml',
              'releaseTransport': 'direct source with a 26-file public-only build artifact',
              'priorKnownGoodMainSha': 'f17ff3476735f423445cb37cb6084b3763c42269',
              'preReleaseRollbackSha': 'f17ff3476735f423445cb37cb6084b3763c42269',
              'legacyPreTenantProofRollbackSha': '047691e35c6b8d38ba5540d1fe4de345ed752a6c',
              'publishedPullRequestNumber': 25,
              'publishedPullRequestUrl': 'https://github.com/UnderNoNameYet/NoNameYet/pull/25',
              'mergeSha': '8ae0bea48491b1442b1181e2c1bed21b1f2479e1',
              'mergedAt': '2026-09-03T06:24:19Z',
              'workflowRunNumber': 49,
              'workflowRunUrl': 'https://github.com/UnderNoNameYet/NoNameYet/actions/workflows/pages.yml?query=branch%3Amain',
              'workflowChecksUrl': 'https://github.com/UnderNoNameYet/NoNameYet/commit/8ae0bea48491b1442b1181e2c1bed21b1f2479e1/checks',
              'workflowConclusion': 'success',
              'deployedUrl': 'https://undernonameyet.github.io/NoNameYet/',
              'liveVerifiedAt': '2026-09-04T04:45:58Z',
              'liveVerification': 'v0.3.2 home, report, methodology, sample matrix, request, privacy, terms, 404, fictional report JSON, and fictional matrix CSV fetched successfully'
          })
          for key in ('candidateVersion', 'candidateBranch', 'candidatePullRequestNumber', 'candidatePullRequestUrl'):
              repo.pop(key, None)
          quality = state['quality']
          quality.update({
              'latestKnownResult': 'local_pr_main_and_live_pass',
              'exactHeadPullRequestSha': '1d474a8eaeb58c8202562c1f58366c9b520385ec',
              'releaseMergeSha': '8ae0bea48491b1442b1181e2c1bed21b1f2479e1',
              'githubPullRequestBuild': 'success',
              'githubMainBuildAndDeploy': 'success',
              'mainWorkflowRunNumber': 49,
              'liveRouteVerification': 'pass',
              'mustRerunAfterChanges': False
          })
          state['nextActions'] = [
              'keep the current site request-only and payment closed',
              'configure verified operator identity, jurisdiction, owned HTTPS intake/deletion, security contact, delivery capacity, and launch-state legal facts before accepting customer work',
              'run the strict commercial release gate only after those facts exist',
              'prefer one safely authorized paid pilot over speculative workspace or recurring-monitoring features',
              'measure repeated demand before implementing Connections, Team, Activity, Plan, or Continuous Verification'
          ]
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          replace_once('handoff/HANDOFF_REPORT.md', '**Snapshot:** 2026-09-03  ', '**Snapshot:** 2026-09-04  ')
          replace_once(
              'handoff/HANDOFF_REPORT.md',
              '**Product stage:** v0.3.2 Focus Workbench release candidate in draft PR; v0.3.1 request-only preview remains live  ',
              '**Product stage:** v0.3.2 Focus Workbench request-only technical preview live  '
          )
          replace_once(
              'handoff/HANDOFF_REPORT.md',
              '**Next objective:** pass the complete release gate, inspect and merge the focused UI PR, verify Pages, then configure real operator/commercial facts before any paid pilot',
              '**Next objective:** preserve the live release, configure real operator/commercial facts, and validate one safely authorized paid pilot before expanding the product surface'
          )
          replace_once(
              'handoff/HANDOFF_REPORT.md',
              'The v0.3.2 candidate replaces abstract presentation with the actual workflow. The public homepage shows a concise fictional Run preview, while `report.html` is now a spacious Focus Workbench organized as **Scope → Matrix → Run → Repair → Report**. The interface preserves local report import, schema 1.0, filters, keyboard selection, print, contextual result limits, and an explicit unresolved state.',
              'The live v0.3.2 release replaces abstract presentation with the actual workflow. The public homepage shows a concise fictional Run preview, while `report.html` is a spacious Focus Workbench organized as **Scope → Matrix → Run → Repair → Report**. The interface preserves local report import, schema 1.0, filters, keyboard selection, print, contextual result limits, and an explicit unresolved state.'
          )
          replace_once(
              'handoff/HANDOFF_REPORT.md',
              'The candidate is in draft PR [#25](https://github.com/UnderNoNameYet/NoNameYet/pull/25). It is not yet the live deployment. The known-good v0.3.1 request-only preview remains at `https://undernonameyet.github.io/NoNameYet/` from PR [#23](https://github.com/UnderNoNameYet/NoNameYet/pull/23) and successful deployment [run #40](https://github.com/UnderNoNameYet/NoNameYet/actions/runs/33372340582).',
              'PR [#25](https://github.com/UnderNoNameYet/NoNameYet/pull/25) was squash-merged at `8ae0bea48491b1442b1181e2c1bed21b1f2479e1`. Main Pages workflow run #49 completed successfully and published the 26-file `public/` artifact at `https://undernonameyet.github.io/NoNameYet/`. Public fetches on 2026-09-04 confirmed the v0.3.2 homepage, workbench, matrix, supporting routes, fictional report JSON, and fictional matrix CSV.'
          )
          replace_once(
              'handoff/HANDOFF_REPORT.md',
              'Local deterministic Chromium QA passed for the implementation candidate:',
              'Local deterministic Chromium QA passed for the released implementation:'
          )
          replace_once(
              'handoff/HANDOFF_REPORT.md',
              'The GitHub PR build runs the complete quality orchestrator with Playwright Chromium, FFmpeg, Pillow, and ReportLab. At this snapshot it is still a release requirement, not a claimed pass. After every material source change, rerun and inspect the generated captures, walkthrough, PDF, source manifest, docs result, and public-only bundle.',
              'The exact-head PR build passed the complete quality orchestrator with Playwright Chromium, FFmpeg, Pillow, and ReportLab. Main workflow run #49 then passed and deployed the same 26-file public-only contract. After every material source change, rerun and inspect the generated captures, walkthrough, PDF, source manifest, documentation result, and public-only bundle.'
          )
          replace_section(
              'handoff/HANDOFF_REPORT.md',
              '## Continuation plan',
              '## Design direction to preserve',
              '''## Continuation plan

          1. Preserve the v0.3.2 request-only preview and its public-only deployment boundary.
          2. Keep `state: preview`, `paymentMode: closed`, and all fictional labels until verified commercial facts exist.
          3. Configure the real contracting identity, jurisdiction, owned HTTPS intake/deletion route, security contact, delivery capacity, processor/tax/refund position, and launch-state legal copy.
          4. Run `npm run release:strict` only after those blockers are truthfully resolved; do not weaken the gate.
          5. Prefer one safely authorized paid pilot over speculative workspace, billing, connection, or recurring-monitoring features.
          6. For any product change, use a focused branch, exact-head CI, changed-file/secret review, generated-artifact reconciliation, and live route verification after merge.
          7. Keep customer evidence, credentials, authorization records, and engagement workspaces outside this public repository.'''
          )

          publication = '''# GitHub publication record

          ## Current status

          - Repository: `UnderNoNameYet/NoNameYet`
          - Authenticated GitHub user: `MYIndieDEV`
          - Default branch: `main`
          - Public origin: `https://undernonameyet.github.io/NoNameYet/`
          - Release pull request: [#25](https://github.com/UnderNoNameYet/NoNameYet/pull/25)
          - Squash merge SHA: `8ae0bea48491b1442b1181e2c1bed21b1f2479e1`
          - Merged at: `2026-09-03T06:24:19Z`
          - Pages workflow: `.github/workflows/pages.yml`
          - Deployment: main workflow run #49 — success, duration 1m 54s
          - Workflow history: `https://github.com/UnderNoNameYet/NoNameYet/actions/workflows/pages.yml?query=branch%3Amain`
          - Exact commit checks: `https://github.com/UnderNoNameYet/NoNameYet/commit/8ae0bea48491b1442b1181e2c1bed21b1f2479e1/checks`
          - Live verification recorded at: `2026-09-04T04:45:58Z`
          - Immediate prior known-good main: `f17ff3476735f423445cb37cb6084b3763c42269`
          - Older pre-TenantProof rollback reference: `047691e35c6b8d38ba5540d1fe4de345ed752a6c`

          Current `main` contains direct TenantProof v0.3.2 source. The public product remains a request-only technical preview. Static intake and report import are local-only, payment is closed, and Northstar CRM remains explicitly fictional.

          ## Publication outcome

          PR #25 shipped the concise product-first homepage, the sidebar-free Scope → Matrix → Run → Repair → Report Focus Workbench, the free fictional matrix/CSV, expanded interaction QA, and a corrected capture-before-sync quality sequence.

          The release changed 47 expected product, handoff, quality, workflow, and operations files: 1,484 additions and 2,512 deletions. No temporary materializer/finalizer path remained in the release tree. GitHub Pages published exactly 26 files generated exclusively from `public/`; repository handoff, operations, tests, tooling, and build output stayed outside the artifact.

          ## Review evidence

          - Exact PR head: `1d474a8eaeb58c8202562c1f58366c9b520385ec`.
          - Exact-head build job `100542681642` completed successfully.
          - Pull-request deploy job `100543081610` was correctly skipped.
          - PR mergeability was `clean`; submitted reviews, review threads, and general review comments remained empty after automated review was requested twice.
          - All 38 patch-bearing files (325,173 characters) passed the compensating credential/private-key/private-email scan with zero hits.
          - GitHub Advanced Security secret scanning was unavailable; this was disclosed rather than represented as a pass.
          - Repository-generated homepage, Matrix, and mobile request captures were directly reviewed. The final Run capture was signed off through approved source-backed state plus matching manifest/checksum evidence; it was not falsely represented as directly opened.

          ## CI and deployment boundary

          The permanent workflow uses Node 20, Python 3.12, pinned Playwright/Pillow/ReportLab, and FFmpeg. It runs `npm run quality`, confirms `state: preview`, confirms `paymentMode: closed`, requires exactly 26 files in `dist/`, and deploys only outside pull-request events.

          `npm run quality` validates static and browser behavior, captures product media, records the walkthrough, synchronizes stable handoff assets, regenerates the PDF/source manifest, checks documentation, runs the release-readiness baseline, and builds `dist/` from `public/` only.

          ## Live verification

          Public fetches returned the v0.3.2 content on:

          - `/`
          - `/report.html`
          - `/methodology.html`
          - `/sample-matrix.html`
          - `/request.html?package=repair`
          - `/privacy.html`
          - `/terms.html`
          - `/404.html`
          - `/assets/sample-report.json`
          - `/assets/sample-boundary-matrix.csv`

          The homepage returned “Verify tenant isolation before you ship,” the workbench returned the five-stage fictional Northstar CRM review, the sample report exposed schema `1.0`, and the matrix CSV returned ten fictional starter checks. The request page remained a private local worksheet and explicitly rejected secrets.

          The sandbox’s interactive browser could not resolve the GitHub Pages/GitHub host, so live pointer/keyboard behavior was not re-labeled as directly browser-tested. That limitation is bounded by the exact-source Chromium interaction suite, successful main build/deploy, and direct deployed-content fetches.

          ## Historical publication

          PR [#23](https://github.com/UnderNoNameYet/NoNameYet/pull/23) originally published TenantProof v0.3.1 at `6bc99104bb91b32afb50c8c7d9b416d74566f8ed` through successful Pages [run #40](https://github.com/UnderNoNameYet/NoNameYet/actions/runs/33372340582). PR [#24](https://github.com/UnderNoNameYet/NoNameYet/pull/24) reconciled that publication at `f17ff3476735f423445cb37cb6084b3763c42269`. These are historical records, not the current release.

          ## Commercial boundary

          This publication does not open customer work or payment. Before commercial intake or invoicing, require verified operator identity and jurisdiction, an owned business contact and HTTPS intake/deletion route, launch-state legal copy, approved retention, delivery capacity, processor/tax/refund configuration, security contact, and written authorization for every target.

          ## Rollback

          For a critical routing, CSP, privacy, truth, or deployment defect, revert `8ae0bea48491b1442b1181e2c1bed21b1f2479e1` or restore prior known-good `f17ff3476735f423445cb37cb6084b3763c42269`, then rerun Pages and verify routes, assets, configuration, and fictional labels. Keep payment and real testing closed during rollback.
          '''
          write('handoff/GITHUB_PUBLICATION.md', '\n'.join(line[10:] if line.startswith('          ') else line for line in publication.strip().splitlines()) + '\n')

          replace_section(
              'handoff/RELEASE_AND_REPOSITORY.md',
              '## Repository',
              '## Authorization and limits',
              '''## Repository

          - GitHub: `UnderNoNameYet/NoNameYet`
          - default branch: `main`
          - public origin: `https://undernonameyet.github.io/NoNameYet/`
          - canonical source: repository root on current `main`
          - inspected v0.3.2 release merge: `8ae0bea48491b1442b1181e2c1bed21b1f2479e1`
          - release pull request: [#25](https://github.com/UnderNoNameYet/NoNameYet/pull/25)
          - release deployment: successful main workflow run #49
          - exact commit checks: `https://github.com/UnderNoNameYet/NoNameYet/commit/8ae0bea48491b1442b1181e2c1bed21b1f2479e1/checks`
          - immediate prior known-good main: `f17ff3476735f423445cb37cb6084b3763c42269`

          The live v0.3.2 request-only preview is published from direct source. The older PR [#23](https://github.com/UnderNoNameYet/NoNameYet/pull/23) / run #40 pair is retained as v0.3.1 history, not current publication state. `047691e35c6b8d38ba5540d1fe4de345ed752a6c` remains the older pre-TenantProof recovery reference.'''
          )
          replace_once(
              'handoff/RELEASE_AND_REPOSITORY.md',
              'Draft PR #25 remains draft until those conditions are true.',
              'PR #25 met those conditions, was converted to ready, and was merged only after exact-head CI, final diff review, secret-scan compensation, and clean review-thread checks.'
          )
          replace_once(
              'handoff/RELEASE_AND_REPOSITORY.md',
              'Screenshots, walkthrough, PDF, checksums, and source manifest are generated by the quality run from current source. Before merge, reconcile committed generated files with the successful candidate output or run a guarded branch finalization that commits only the known generated paths. Never let an automatic finalizer modify `main`, deploy, or copy arbitrary build output.',
              'Screenshots, walkthrough, PDF, checksums, and source manifest are generated by the quality run from current source. Before any future merge, reconcile committed generated files with successful exact-head output or use a guarded branch-only finalization that commits only known generated paths. Never let an automatic finalizer modify `main`, deploy directly, or copy arbitrary build output.'
          )
          replace_section(
              'handoff/RELEASE_AND_REPOSITORY.md',
              '## Rollback',
              '## Versions',
              '''## Rollback

          - revert the v0.3.2 release merge `8ae0bea48491b1442b1181e2c1bed21b1f2479e1` or restore prior known-good main `f17ff3476735f423445cb37cb6084b3763c42269`
          - keep configuration at preview and payment closed
          - rerun the permanent Pages workflow
          - verify routes, assets, CSP, sample data, fictional labels, and workbench behavior after rollback
          - document cause and corrective action

          There is no migration or hosted state in v0.3.2.'''
          )
          replace_once(
              'handoff/RELEASE_AND_REPOSITORY.md',
              '- `0.3.1` — live request-only technical preview\n- `0.3.2` — Focus Workbench release candidate',
              '- `0.3.1` — initial request-only GitHub Pages preview\n- `0.3.2` — live product-first Focus Workbench preview'
          )
          replace_once(
              'handoff/RELEASE_AND_REPOSITORY.md',
              'Do not mark v0.3.2 live until Pages succeeds and routes/interactions are verified. Do not label 1.0 until owned intake, operator/commercial facts, legal state, and strict release checks are complete.',
              'v0.3.2 is live and verified within the documented network limits. Do not label 1.0 until owned intake, operator/commercial facts, legal state, and strict release checks are complete.'
          )

          replace_once(
              'handoff/AI_CONTINUATION.md',
              '> Current state: the premium request-only preview is live at `https://undernonameyet.github.io/NoNameYet/` from main SHA `6bc99104bb91b32afb50c8c7d9b416d74566f8ed` after PR #23 and successful Pages run #40; the local quality package passed; a public Notion qualification form, private pipeline, launch page, and fictional sample report exist; payment and static commercial intake are closed; there are no customers, revenue, testimonials, or real findings. Preserve those truths.',
              '> Current state: v0.3.2 is live at `https://undernonameyet.github.io/NoNameYet/` from release merge `8ae0bea48491b1442b1181e2c1bed21b1f2479e1` after PR #25 and successful main Pages run #49. The release contains the product-first homepage, free fictional matrix, and sidebar-free Scope → Matrix → Run → Repair → Report Focus Workbench in an exact 26-file public-only artifact. Payment and commercial intake remain closed; there are no customers, revenue, testimonials, or real findings. Preserve those truths.'
          )
          replace_once(
              'handoff/AI_CONTINUATION.md',
              '- GitHub request-only preview: deployed from `6bc99104bb91b32afb50c8c7d9b416d74566f8ed` through PR #23 and successful Pages run #40',
              '- GitHub request-only preview: v0.3.2 deployed from `8ae0bea48491b1442b1181e2c1bed21b1f2479e1` through PR #25 and successful main Pages run #49'
          )

          replace_once('handoff/ASSET_MANIFEST.md', 'npm run handoff:pdf', 'npm run handoff:report')
          replace_once('handoff/ASSET_MANIFEST.md', 'npm run source:manifest', 'npm run handoff:manifest')

          replace_once(
              'operations/launch-checklist.md',
              '- [x] Interactive fictional report\n- [x] Local report import',
              '- [x] Interactive fictional report\n- [x] Product-first Focus Workbench with Scope → Matrix → Run → Repair → Report\n- [x] Free fictional boundary-matrix page and CSV\n- [x] Local report import'
          )
          replace_once(
              'operations/launch-checklist.md',
              '- [x] Create a release branch from inspected `main`\n- [x] Push direct source and open pull request #23\n- [x] Review exact diff and successful PR CI\n- [x] Apply standing deployment authorization after checks\n- [x] Squash-merge and verify successful Pages deployment\n- [x] Fetch every primary live route and fictional report data',
              '- [x] Initial TenantProof publication: PR #23 and post-deployment reconciliation PR #24\n- [x] Focus Workbench release branch created from inspected `main`\n- [x] PR #25 exact 47-file diff, generated media, and exact-head CI reviewed\n- [x] Automated review requested twice; no submitted review, thread, or actionable comment returned\n- [x] Apply standing deployment authorization only after checks\n- [x] Squash-merge PR #25 at `8ae0bea48491b1442b1181e2c1bed21b1f2479e1`\n- [x] Verify successful main Pages workflow run #49 and the 26-file public-only contract\n- [x] Fetch every primary live route plus fictional report JSON and boundary-matrix CSV'
          )

          replace_once('tools/build-handoff-report.py', 'Paragraph("2026-09-03", styles["TPBody"])', 'Paragraph("2026-09-04", styles["TPBody"])')
          replace_once(
              'tools/build-handoff-report.py',
              'Paragraph("v0.3.2 Focus Workbench candidate in draft PR; v0.3.1 remains live", styles["TPBody"])',
              'Paragraph("v0.3.2 Focus Workbench request-only preview live", styles["TPBody"])'
          )
          replace_once(
              'tools/build-handoff-report.py',
              'Paragraph("Local Chromium QA passed; complete GitHub candidate gate required before merge", styles["TPBody"])',
              'Paragraph("PR/main quality passed; 26-file artifact and live routes verified", styles["TPBody"])'
          )
          PY

          rm .github/workflows/finalize-tenantproof-v032-publication.yml

      - name: Run complete quality and artifact reconciliation
        shell: bash
        run: |
          set -euo pipefail
          npm run quality
          grep -q '"state": "preview"' public/assets/site-config.js
          grep -q '"paymentMode": "closed"' public/assets/site-config.js
          test "$(find dist -type f | wc -l)" -eq 26

      - name: Restrict and commit final changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          allowed_exact = {
              '.github/workflows/finalize-tenantproof-v032-publication.yml',
              'AGENTS.md',
              'CHANGELOG.md',
              'handoff/AI_CONTINUATION.md',
              'handoff/ASSET_MANIFEST.md',
              'handoff/CURRENT_STATE.json',
              'handoff/GITHUB_PUBLICATION.md',
              'handoff/HANDOFF_REPORT.md',
              'handoff/HANDOFF_REPORT.pdf',
              'handoff/RELEASE_AND_REPOSITORY.md',
              'handoff/SOURCE_MANIFEST.json',
              'operations/launch-checklist.md',
              'tools/build-handoff-report.py',
          }
          allowed_prefixes = ('handoff/assets/',)
          lines = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          changed = []
          unexpected = []
          for line in lines:
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.append(path)
              if path not in allowed_exact and not path.startswith(allowed_prefixes):
