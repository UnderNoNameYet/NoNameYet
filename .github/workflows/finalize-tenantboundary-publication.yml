name: Finalize TenantBoundary publication handoff

on:
  push:
    branches: [docs/tenantboundary-v040-publication]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tenantboundary-publication-finalizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: docs/tenantboundary-v040-publication

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic release dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==10.4.0 reportlab==4.2.5
          npm install --no-save --no-package-lock playwright@1.50.1
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          CHROMIUM_PATH="$(node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")"
          sudo ln -sf "$CHROMIUM_PATH" /usr/local/bin/chromium

      - name: Validate and rebuild live handoff
        shell: bash
        run: |
          set -euo pipefail
          npm run quality
          git restore -- public/assets/tenantboundary-og.png public/assets/tenantproof-og.png public/assets/icon-192.png public/assets/icon-512.png
          git restore -- handoff/assets/01-home-desktop.png handoff/assets/02-report-desktop.png handoff/assets/03-request-mobile.png
          git restore -- handoff/assets/04-home-mobile-full.png handoff/assets/05-social-preview.png handoff/assets/06-icon-192.png
          git restore -- handoff/assets/07-icon-512.png handoff/assets/08-sample-matrix-desktop.png
          git restore -- handoff/assets/walkthrough.webm handoff/assets/SHA256SUMS
          rm -f .github/workflows/finalize-tenantboundary-publication.yml
          npm run handoff:manifest
          npm run docs:check

      - name: Commit only publication handoff artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add handoff/HANDOFF_REPORT.pdf handoff/SOURCE_MANIFEST.json
          if git diff --cached --quiet; then
            echo "Publication handoff artifacts already match."
            exit 0
          fi
          git commit -m "chore: finalize TenantBoundary publication handoff"
          git push origin HEAD:"${GITHUB_REF_NAME}"
