name: Finalize TenantProof first-pilot readiness

on:
  push:
    branches:
      - ops/tenantproof-first-pilot-readiness
    paths:
      - .github/workflows/finalize-tenantproof-pilot-readiness.yml

permissions:
  contents: write

concurrency:
  group: finalize-tenantproof-pilot-readiness
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/tenantproof-first-pilot-readiness
          fetch-depth: 0

      - name: Reconcile operational handoff
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/reconcile-pilot-readiness.py
          echo '7bf467c87cfeaa4e8a140870f6c2bbef1ea73f94ba479ec5d8319d496edf8308  /tmp/reconcile-pilot-readiness.py' | sha256sum -c -
          python3 /tmp/reconcile-pilot-readiness.py
          rm .github/workflows/finalize-tenantproof-pilot-readiness.yml
          node --check tools/check-pilot-readiness.mjs
          node --check tools/release-check.mjs
          node --check tools/check-docs.mjs
          node --check tools/quality-gate.mjs
          node tools/check-pilot-readiness.mjs > /tmp/pilot-readiness.json
          node -e "const r=require('/tmp/pilot-readiness.json'); if(!r.valid || r.ready || r.verifiedGates !== 0 || r.requiredGates !== 12) process.exit(1)"
          if node tools/check-pilot-readiness.mjs --strict --stage=firstPilot >/tmp/pilot-strict.txt 2>&1; then
            echo 'Blocked template unexpectedly passed strict mode' >&2
            exit 1
          fi
          node tools/build-source-manifest.mjs
          node tools/check-docs.mjs

      - name: Commit reconciled readiness package
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            AGENTS.md README.md CHANGELOG.md \
            operations/operator-decisions.md operations/launch-checklist.md operations/github-release-runbook.md \
            handoff/README.md handoff/ROADMAP_V1_V2_V3.md handoff/FEATURE_AND_FUNCTION_INVENTORY.md \
            handoff/QUALITY_GATES.md handoff/DECISION_LOG.md handoff/TECHNICAL_ARCHITECTURE.md \
            handoff/CURRENT_STATE.json handoff/SOURCE_MANIFEST.json \
            .github/workflows/finalize-tenantproof-pilot-readiness.yml
          git diff --cached --quiet && { echo 'No reconciliation changes staged' >&2; exit 1; }
          git commit -m "docs: reconcile first-pilot readiness handoff"
          git push origin HEAD:ops/tenantproof-first-pilot-readiness
