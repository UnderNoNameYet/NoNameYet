name: Finalize TenantProof readiness hardening

on:
  push:
    branches:
      - ops/tenantproof-first-pilot-readiness
    paths:
      - .github/workflows/finalize-tenantproof-pilot-readiness-v2.yml

permissions:
  contents: write

concurrency:
  group: finalize-tenantproof-pilot-readiness-v2
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/tenantproof-first-pilot-readiness
          fetch-depth: 0

      - name: Validate privacy-safe gate and regenerate manifest
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/check-pilot-readiness.mjs
          node tools/check-pilot-readiness.mjs > /tmp/pilot-blocked.json
          node -e "const r=require('/tmp/pilot-blocked.json'); if(!r.valid || r.ready || r.source !== 'committed-template' || r.verifiedGates !== 0 || r.requiredGates !== 12 || JSON.stringify(r).includes('evidenceReference')) process.exit(1)"
          if node tools/check-pilot-readiness.mjs --strict --stage=firstPilot >/tmp/pilot-blocked-strict.json 2>&1; then
            echo 'Blocked template unexpectedly passed strict mode' >&2
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('config/pilot-readiness.example.json','utf8'));
          c.reviewedAt=new Date().toISOString().slice(0,10);
          c.reviewedBy='operator';
          c.attestation=true;
          for(const gate of Object.values(c.gates)) {
            gate.status='verified';
            gate.evidenceReference='PRIVATE-REF-MUST-NOT-PRINT';
          }
          fs.writeFileSync('/tmp/pilot-ready.json',JSON.stringify(c));
          NODE
          node tools/check-pilot-readiness.mjs --config=/tmp/pilot-ready.json --strict --stage=launchExperiment > /tmp/pilot-ready-report.json
          node -e "const r=require('/tmp/pilot-ready-report.json'); const text=JSON.stringify(r); if(!r.valid || !r.ready || r.source !== 'explicit-operator-record' || r.verifiedGates !== 12 || text.includes('PRIVATE-REF-MUST-NOT-PRINT') || text.includes('/tmp/pilot-ready.json') || text.includes('evidenceReference')) process.exit(1)"
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('config/pilot-readiness.example.json','utf8'));
          delete c.gates.contractingIdentity;
          c.gates['DO-NOT-PRINT-PRIVATE-NAME']={status:'verified',evidenceReference:'DO-NOT-PRINT-PRIVATE-REF'};
          c.reviewedAt='2026-02-31';
          c.reviewedBy=42;
          c.attestation='yes';
          fs.writeFileSync('/tmp/DO-NOT-PRINT-PRIVATE-PATH.json',JSON.stringify(c));
          NODE
          if node tools/check-pilot-readiness.mjs --config=/tmp/DO-NOT-PRINT-PRIVATE-PATH.json >/tmp/pilot-invalid.json 2>&1; then
            echo 'Malformed fixture unexpectedly passed' >&2
            exit 1
          fi
          if grep -Eq 'DO-NOT-PRINT-PRIVATE-(NAME|REF|PATH)|evidenceReference' /tmp/pilot-invalid.json; then
            echo 'Private fixture detail leaked' >&2
            exit 1
          fi
          node -e "const r=require('/tmp/pilot-invalid.json'); if(r.valid || !r.errors.length || r.source !== 'explicit-operator-record') process.exit(1)"
          rm .github/workflows/finalize-tenantproof-pilot-readiness-v2.yml
          node tools/build-source-manifest.mjs
          node tools/check-docs.mjs

      - name: Commit hardened manifest
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add handoff/SOURCE_MANIFEST.json .github/workflows/finalize-tenantproof-pilot-readiness-v2.yml
          git diff --cached --quiet && { echo 'No finalizer changes staged' >&2; exit 1; }
          git commit -m "test: harden pilot readiness privacy checks"
          git push origin HEAD:ops/tenantproof-first-pilot-readiness
