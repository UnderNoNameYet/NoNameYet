name: Finalize Focus Workbench v0.3.2 artifacts

on:
  push:
    branches:
      - design/tenantproof-focus-workbench-v032
    paths:
      - '.github/workflows/finalize-focus-workbench-v032.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tenantproof-v032-artifact-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.ref == 'refs/heads/design/tenantproof-focus-workbench-v032'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: design/tenantproof-focus-workbench-v032
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic release dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==10.4.0 reportlab==4.2.5
          npm install --no-save --no-package-lock playwright@1.50.1
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          CHROMIUM_PATH="$(node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")"
          sudo ln -sf "$CHROMIUM_PATH" /usr/local/bin/chromium

      - name: Generate and validate current-source artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-focus-workbench-v032.yml
          npm run quality
          test "$(find dist -type f | wc -l)" -eq 26

      - name: Commit only generated handoff outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/finalize-focus-workbench-v032.yml \
            handoff/HANDOFF_REPORT.pdf \
            handoff/SOURCE_MANIFEST.json \
            handoff/assets/01-home-desktop.png \
            handoff/assets/02-report-desktop.png \
            handoff/assets/03-request-mobile.png \
            handoff/assets/04-home-mobile-full.png \
            handoff/assets/05-social-preview.png \
            handoff/assets/06-icon-192.png \
            handoff/assets/07-icon-512.png \
            handoff/assets/08-sample-matrix-desktop.png \
            handoff/assets/walkthrough.webm \
            handoff/assets/SHA256SUMS
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git commit -m "chore: refresh v0.3.2 handoff artifacts"
          git push origin HEAD:design/tenantproof-focus-workbench-v032
