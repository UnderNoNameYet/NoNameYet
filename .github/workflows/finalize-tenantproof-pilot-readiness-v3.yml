name: Finalize TenantProof readiness isolation

on:
  push:
    branches:
      - ops/tenantproof-first-pilot-readiness
    paths:
      - .github/workflows/finalize-tenantproof-pilot-readiness-v3.yml

permissions:
  contents: write

concurrency:
  group: finalize-tenantproof-pilot-readiness-v3
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/tenantproof-first-pilot-readiness
          fetch-depth: 0

      - name: Validate readiness edge cases and manifest isolation
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/check-pilot-readiness.mjs
          node --check tools/build-source-manifest.mjs
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');

          const root = process.cwd();
          const checker = path.join(root, 'tools/check-pilot-readiness.mjs');
          const template = JSON.parse(fs.readFileSync(path.join(root, 'config/pilot-readiness.example.json'), 'utf8'));
          const tempRoot = fs.mkdtempSync(path.join(os.tmpdir(), 'tenantproof-readiness-'));
          const privatePathSentinel = 'DO-NOT-PRINT-PRIVATE-PATH';
          const evidenceSentinel = 'DO-NOT-PRINT-EVIDENCE-VALUE';
          const unknownGateSentinel = 'DO-NOT-PRINT-PRIVATE-GATE';
          let sequence = 0;

          function run(args = []) {
            const result = spawnSync(process.execPath, [checker, ...args], { cwd: root, encoding: 'utf8' });
            let report;
            try { report = JSON.parse(result.stdout); }
            catch { throw new Error(`Checker did not emit JSON (status ${result.status})`); }
            return { ...result, report, text: `${result.stdout}\n${result.stderr}` };
          }

          function runFixture(value, args = []) {
            sequence += 1;
            const file = path.join(tempRoot, `${privatePathSentinel}-${sequence}.json`);
            fs.writeFileSync(file, JSON.stringify(value));
            return run([`--config=${file}`, ...args]);
          }

          function assertRedacted(result, values = []) {
            for (const value of [privatePathSentinel, ...values]) {
              assert.equal(result.text.includes(value), false, `Output leaked ${value}`);
            }
          }

          try {
            const blocked = run();
            assert.equal(blocked.status, 0);
            assert.equal(blocked.report.valid, true);
            assert.equal(blocked.report.ready, false);
            assert.equal(blocked.report.source, 'committed-template');
            assert.equal(blocked.report.verifiedGates, 0);
            assert.equal(blocked.report.requiredGates, 12);

            const blockedStrict = run(['--strict', '--stage=firstPilot']);
            assert.equal(blockedStrict.status, 1);
            assert.equal(blockedStrict.report.valid, true);
            assert.equal(blockedStrict.report.ready, false);

            const readyConfig = structuredClone(template);
            readyConfig.reviewedAt = new Date().toISOString().slice(0, 10);
            readyConfig.reviewedBy = 'operator';
            readyConfig.attestation = true;
            for (const gate of Object.values(readyConfig.gates)) {
              gate.status = 'verified';
              gate.evidenceReference = evidenceSentinel;
            }
            const ready = runFixture(readyConfig, ['--strict', '--stage=launchExperiment']);
            assert.equal(ready.status, 0);
            assert.equal(ready.report.valid, true);
            assert.equal(ready.report.ready, true);
            assert.equal(ready.report.source, 'explicit-operator-record');
            assert.equal(ready.report.verifiedGates, 12);
            assertRedacted(ready, [evidenceSentinel]);

            for (const invalidRoot of [null, false, 0, '', [], [1]]) {
              const invalid = runFixture(invalidRoot);
              assert.equal(invalid.status, 1);
              assert.equal(invalid.report.valid, false);
              assert.equal(invalid.report.ready, false);
              assert.equal(invalid.report.errors.includes('Readiness configuration must be an object'), true);
              assertRedacted(invalid);
            }

            const unknownGate = structuredClone(template);
            unknownGate.gates[unknownGateSentinel] = { status: 'blocked', evidenceReference: '' };
            const unknown = runFixture(unknownGate);
            assert.equal(unknown.status, 1);
            assert.equal(unknown.report.valid, false);
            assert.equal(unknown.report.errors.some(message => message.includes('unknown gate')), true);
            assertRedacted(unknown, [unknownGateSentinel]);

            const nonStringEvidence = structuredClone(template);
            nonStringEvidence.reviewedAt = new Date().toISOString().slice(0, 10);
            nonStringEvidence.reviewedBy = 'operator';
            nonStringEvidence.attestation = true;
            nonStringEvidence.gates.contractingIdentity.status = 'verified';
            nonStringEvidence.gates.contractingIdentity.evidenceReference = { secret: evidenceSentinel };
            const nonString = runFixture(nonStringEvidence);
            assert.equal(nonString.status, 1);
            assert.equal(nonString.report.valid, false);
            assert.equal(nonString.report.errors.some(message => message.includes('must be a string')), true);
            assertRedacted(nonString, [evidenceSentinel]);

            for (const reviewedAt of ['2026-02-31', new Date(Date.now() - 45 * 86_400_000).toISOString().slice(0, 10)]) {
              const badDateConfig = structuredClone(template);
              badDateConfig.reviewedAt = reviewedAt;
              badDateConfig.reviewedBy = 'operator';
              badDateConfig.attestation = true;
              badDateConfig.gates.contractingIdentity.status = 'verified';
              badDateConfig.gates.contractingIdentity.evidenceReference = evidenceSentinel;
              const badDate = runFixture(badDateConfig);
              assert.equal(badDate.status, 1);
              assert.equal(badDate.report.valid, false);
              assert.equal(badDate.report.errors.some(message => message.includes('real date current within the last 30 days')), true);
              assertRedacted(badDate, [evidenceSentinel]);
            }

            const unknownFields = structuredClone(template);
            unknownFields['DO-NOT-PRINT-TOPLEVEL-FIELD'] = evidenceSentinel;
            unknownFields.gates.contractingIdentity['DO-NOT-PRINT-GATE-FIELD'] = evidenceSentinel;
            const unknownFieldResult = runFixture(unknownFields);
            assert.equal(unknownFieldResult.status, 1);
            assert.equal(unknownFieldResult.report.valid, false);
            assert.equal(unknownFieldResult.report.errors.some(message => message.includes('unsupported top-level field')), true);
            assert.equal(unknownFieldResult.report.errors.some(message => message.includes('unsupported field')), true);
            assertRedacted(unknownFieldResult, [evidenceSentinel, 'DO-NOT-PRINT-TOPLEVEL-FIELD', 'DO-NOT-PRINT-GATE-FIELD']);
          } finally {
            fs.rmSync(tempRoot, { recursive: true, force: true });
          }
          NODE

          rm .github/workflows/finalize-tenantproof-pilot-readiness-v3.yml
          cat > config/pilot-readiness.json <<'JSON'
          {
            "schemaVersion": 1,
            "reviewedAt": "",
            "reviewedBy": "MANIFEST-PRIVATE-IDENTITY-SENTINEL",
            "attestation": false,
            "gates": {
              "contractingIdentity": {
                "status": "blocked",
                "evidenceReference": "MANIFEST-PRIVATE-EVIDENCE-SENTINEL"
              }
            }
          }
          JSON
          node tools/build-source-manifest.mjs > /tmp/pilot-manifest-private.json
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('handoff/SOURCE_MANIFEST.json', 'utf8'));
          const text = JSON.stringify(manifest);
          if (text.includes('config/pilot-readiness.json') || text.includes('MANIFEST-PRIVATE-')) {
            throw new Error('Private readiness fixture leaked into source manifest');
          }
          NODE
          rm config/pilot-readiness.json
          node tools/build-source-manifest.mjs > /tmp/pilot-manifest-final.json
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('handoff/SOURCE_MANIFEST.json', 'utf8'));
          const expectedRoles = {
            'repository-root': 11,
            'repository-workflow': 2,
            'release-configuration': 3,
            'handoff-source': 22,
            'handoff-media': 14,
            'operations-private-template': 11,
            'deployable-public': 26,
            'report-contract': 1,
            'build-quality-tooling': 17
          };
          if (manifest.product !== 'TenantProof' || manifest.version !== '0.3.2') throw new Error('Manifest product identity drifted');
          if (manifest.deployRoot !== 'public/' || manifest.files !== 107) throw new Error('Manifest boundary or file count drifted');
          if (JSON.stringify(manifest.byRole) !== JSON.stringify(expectedRoles)) throw new Error('Manifest role counts drifted');
          if (manifest.entries.some(entry => entry.path === 'config/pilot-readiness.json')) throw new Error('Private readiness path was indexed');
          const publicHashes = new Map(manifest.entries.map(entry => [entry.path, entry.sha256]));
          const expectedPublicHashes = {
            'public/index.html': '1cf962f7739efc03ac20006c96e660786a63124ba40d7b02b7cbb1600fed6476',
            'public/report.html': 'bdc454e22c046c07582a84781f330dd628de6ec92df1ee4c3b9ddc7b73a1912a',
            'public/assets/workbench.css': 'b52cfb3eb848d49cefd8889313bcd337c6e29cea913f0281b83ab9a559f39f95',
            'public/assets/workbench.js': '788fbe4d22fe3965465d3b76bc7c48ff17935ca21077d51f70f0a9d74cc93636'
          };
          for (const [file, hash] of Object.entries(expectedPublicHashes)) {
            if (publicHashes.get(file) !== hash) throw new Error(`Public source hash drifted: ${file}`);
          }
          NODE
          node tools/check-docs.mjs
          node tools/check-pilot-readiness.mjs > /tmp/pilot-final-blocked.json
          node -e "const r=require('/tmp/pilot-final-blocked.json'); if(!r.valid || r.ready || r.source !== 'committed-template') process.exit(1)"
          test ! -e config/pilot-readiness.json
          test ! -e .github/workflows/finalize-tenantproof-pilot-readiness-v3.yml

      - name: Commit verified manifest
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add handoff/SOURCE_MANIFEST.json .github/workflows/finalize-tenantproof-pilot-readiness-v3.yml
          git diff --cached --quiet && { echo 'No finalizer changes staged' >&2; exit 1; }
          git commit -m "test: verify pilot readiness isolation"
          git push origin HEAD:ops/tenantproof-first-pilot-readiness
