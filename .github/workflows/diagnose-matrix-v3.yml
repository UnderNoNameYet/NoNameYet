name: Diagnose verified TenantProof matrix patch

on:
  push:
    branches:
      - feature/tenant-boundary-matrix-20260901

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/tenant-boundary-matrix-20260901
          fetch-depth: 0

      - name: Run patch and persist exact result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import subprocess
          import traceback

          log = []
          try:
              chunks = sorted(Path('tools').glob('.matrix-chunk-*'))
              log.append('chunks=' + ','.join(path.name for path in chunks))
              compact = ''.join(path.read_text(encoding='utf-8') for path in chunks)
              log.append(f'payload_chars={len(compact)}')
              decoded = gzip.decompress(base64.b64decode(compact, validate=True))
              digest = hashlib.sha256(decoded).hexdigest()
              log.append(f'patch_bytes={len(decoded)}')
              log.append(f'patch_sha256={digest}')
              expected = '5aed4b833abef6b2698f1eaa726c1a78f0fd1ec018b47c24c49f57666afd390b'
              if digest != expected:
                  raise RuntimeError(f'Patch checksum mismatch: {digest}')
              target = Path('tools/apply-sample-matrix.py')
              target.write_bytes(decoded)
              result = subprocess.run(['python', str(target)], text=True, capture_output=True)
              log.append(f'patch_exit={result.returncode}')
              log.append('patch_stdout:\n' + result.stdout)
              log.append('patch_stderr:\n' + result.stderr)
          except Exception:
              log.append('exception:\n' + traceback.format_exc())
          Path('MATERIALIZER_ERROR.txt').write_text('\n'.join(log) + '\n', encoding='utf-8')
          PY
          rm -f tools/apply-sample-matrix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MATERIALIZER_ERROR.txt
          git commit -m 'chore: record verified matrix patch diagnostic'
          git push origin HEAD:feature/tenant-boundary-matrix-20260901
